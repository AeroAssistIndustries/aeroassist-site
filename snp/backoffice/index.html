.staging-bar .sb-text{opacity:.85}
.staging-bar .sb-role{margin-left:auto;display:flex;align-items:center;gap:6px}
.staging-bar select,.staging-bar button{font:inherit;color:#181415;background:#F2EEEE;border:0;border-radius:5px;padding:4px 8px;cursor:pointer}
.staging-bar ~ .appbar{top:0}
